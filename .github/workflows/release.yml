name: Release

on:
  workflow_dispatch:

jobs:
  android:
    name: Build Android binaries
    runs-on: ubuntu-22.04
    environment: publish
    permissions:
      contents: write

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup CMake
        uses: lukka/get-cmake@latest
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build native lib
        run: ./gradlew buildNativeProject
      - name: Build Android bindings
        run: ./gradlew :physx-jni-android:buildNativeProjectAndroid
      - name: Build Android AAR
        run: ./gradlew :physx-jni-android:build
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-native-libs
          path: |
            physx-jni-android/build/outputs/aar/*.aar
            physx-jni-android/build/libs/*.jar
          compression-level: 0

  publish:
    name: Build and publish Java and Android libs
    runs-on: ubuntu-latest
    needs: [ android ]

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Download native lib artifacts
        uses: actions/download-artifact@v4
      - name: Copy downloaded artifacts
